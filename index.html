<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'VT323', monospace;
    padding: 24px;
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: 2px; }
  h2 { font-size: 24px; margin: 0 0 16px; font-weight: normal; }
  .step-label { font-size: 20px; opacity: 0.6; margin-bottom: 32px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Format controls: steppers + toggle */
  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .control-label { font-size: 28px; }
  .stepper { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
  .arrow {
    background: #1a1a1a;
    border: 2px solid #333;
    color: #e0e0e0;
    font-family: 'VT323', monospace;
    font-size: 18px;
    width: 72px;
    padding: 6px 0;
    cursor: pointer;
    line-height: 1;
  }
  .arrow:active { background: #2a2a2a; }
  .stepper-val {
    font-size: 36px;
    width: 72px;
    text-align: center;
    border: 2px solid #333;
    background: #1a1a1a;
    padding: 2px 0;
  }
  .toggle { display: flex; margin: 8px 0 8px; }
  .toggle-btn {
    flex: 1;
    padding: 16px;
    background: #1a1a1a;
    border: 2px solid #333;
    color: #e0e0e0;
    font-family: 'VT323', monospace;
    font-size: 24px;
    cursor: pointer;
  }
  .toggle-btn.active { background: #e0e0e0; color: #0a0a0a; }

  .upload-block { margin-bottom: 20px; }
  .upload-label { font-size: 20px; margin-bottom: 8px; }
  input[type="file"] {
    display: block;
    width: 100%;
    padding: 16px;
    background: #1a1a1a;
    border: 2px dashed #444;
    color: #e0e0e0;
    font-family: 'VT323', monospace;
    font-size: 18px;
  }
  .preview-img {
    width: 100%;
    margin-top: 8px;
    max-height: 200px;
    object-fit: cover;
  }
  textarea {
    width: 100%;
    min-height: 100px;
    padding: 16px;
    background: #1a1a1a;
    border: 2px solid #333;
    color: #e0e0e0;
    font-family: 'VT323', monospace;
    font-size: 22px;
    resize: vertical;
  }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .btn {
    flex: 1;
    min-width: 120px;
    padding: 16px;
    font-family: 'VT323', monospace;
    font-size: 22px;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: #e0e0e0;
    color: #0a0a0a;
  }
  .btn-primary:disabled { opacity: 0.4; }
  .btn-secondary {
    background: transparent;
    color: #e0e0e0;
    border: 2px solid #333;
  }
  canvas {
    width: 100%;
    max-width: 500px;
    border: 2px solid #333;
    display: block;
    margin-bottom: 16px;
  }
  .hint { font-size: 16px; opacity: 0.5; margin-top: 16px; }
</style>
</head>
<body>

<h1>NIGHTLY COMPOSER</h1>
<p class="step-label">Step <span id="stepNum">1</span> of <span id="stepTotal">5</span></p>

<!-- Step 1: Background -->
<div class="screen active" id="screen1">
  <h2>1. Choose background</h2>
  <div class="upload-block">
    <div class="upload-label">Background image <span id="bgCheck"></span></div>
    <input type="file" accept="image/*" id="bgFile">
    <img class="preview-img" id="bgPreview" style="display:none">
  </div>
  <div style="margin-top:8px;">
    <button class="btn btn-secondary" id="bgWhiteBtn" style="width:100%;">Or use plain white</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="bgNextBtn" onclick="goNext()" disabled>Next</button>
  </div>
</div>

<!-- Step 2: Format -->
<div class="screen" id="screen2">
  <h2>2. Choose format</h2>

  <div class="control-row">
    <span class="control-label"># of photos</span>
    <div class="stepper">
      <button class="arrow" id="photoUp" aria-label="more photos">&#9650;</button>
      <span class="stepper-val" id="photoVal">2</span>
      <button class="arrow" id="photoDown" aria-label="fewer photos">&#9660;</button>
    </div>
  </div>

  <div class="control-row">
    <span class="control-label"># of texts</span>
    <div class="stepper">
      <button class="arrow" id="textUp" aria-label="more texts">&#9650;</button>
      <span class="stepper-val" id="textVal">1</span>
      <button class="arrow" id="textDown" aria-label="fewer texts">&#9660;</button>
    </div>
  </div>

  <div class="toggle">
    <button class="toggle-btn active" data-mode="aligned">aligned</button>
    <button class="toggle-btn" data-mode="random">random</button>
  </div>
  <p class="hint">Aligned = neat grid. Random = scattered placement (re-roll on the result screen).</p>

  <div class="btn-row">
    <button class="btn btn-secondary" onclick="goBack()">Back</button>
    <button class="btn btn-primary" onclick="goNext()">Next</button>
  </div>
</div>

<!-- Step 3: Upload photos -->
<div class="screen" id="screen3">
  <h2>3. Upload photos</h2>
  <div id="uploadSlots"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="goBack()">Back</button>
    <button class="btn btn-primary" id="photoNextBtn" disabled>Next</button>
  </div>
</div>

<!-- Step 4: Text -->
<div class="screen" id="screen4">
  <h2>4. Write text</h2>
  <div id="textInputs"></div>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="goBack()">Back</button>
    <button class="btn btn-primary" id="generateBtn" onclick="generate()" disabled>Generate</button>
  </div>
</div>

<!-- Step 5: Result -->
<div class="screen" id="screen5">
  <h2>Download</h2>
  <canvas id="canvas"></canvas>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadImage()">Save Image</button>
    <button class="btn btn-secondary" id="rerollBtn" onclick="reroll()" style="display:none;">Re-roll</button>
    <button class="btn btn-secondary" onclick="goToEdit()">Edit</button>
    <button class="btn btn-secondary" onclick="reset()">Start over</button>
  </div>
</div>

<script>
let state = {
  background: null,   // data URL or null (=> white)
  photoCount: 2,      // 1..4
  textCount: 1,       // 0..3
  mode: 'aligned',    // 'aligned' | 'random'
  photos: [],         // length photoCount, each data URL or null
  texts: [],          // length textCount, each string
  seed: 0
};

const PHOTO_MIN = 1, PHOTO_MAX = 4;
const TEXT_MIN = 0, TEXT_MAX = 3;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

let currentScreen = 'screen1';

// The active screens in order. Text step is skipped when textCount is 0.
function flowScreens() {
  const f = ['screen1', 'screen2', 'screen3'];
  if (state.textCount > 0) f.push('screen4');
  f.push('screen5');
  return f;
}

function showScreen(id) {
  currentScreen = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');

  const flow = flowScreens();
  const idx = Math.max(0, flow.indexOf(id));
  document.getElementById('stepNum').textContent = idx + 1;
  document.getElementById('stepTotal').textContent = flow.length;

  if (id === 'screen3') renderUploadSlots();
  if (id === 'screen4') renderTextInputs();
  if (id === 'screen5') setTimeout(drawCanvas, 50);
}

function goNext() {
  const flow = flowScreens();
  const idx = flow.indexOf(currentScreen);
  if (idx === -1) return;
  // If the next screen is the result, run generate() so the seed/reroll are set up.
  if (flow[idx + 1] === 'screen5') { generate(); return; }
  if (idx < flow.length - 1) showScreen(flow[idx + 1]);
}

function goBack() {
  const flow = flowScreens();
  const idx = flow.indexOf(currentScreen);
  if (idx > 0) showScreen(flow[idx - 1]);
}

function goToEdit() {
  // Jump back to the last input screen (text if present, else photos)
  showScreen(state.textCount > 0 ? 'screen4' : 'screen3');
}

/* ---------- Step 1: background ---------- */
document.getElementById('bgFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.background = ev.target.result;
    document.getElementById('bgCheck').textContent = '✓';
    const img = document.getElementById('bgPreview');
    img.src = ev.target.result;
    img.style.display = 'block';
    document.getElementById('bgNextBtn').disabled = false;
  };
  reader.readAsDataURL(file);
});

document.getElementById('bgWhiteBtn').addEventListener('click', () => {
  state.background = null;
  document.getElementById('bgCheck').textContent = '(white)';
  document.getElementById('bgPreview').style.display = 'none';
  document.getElementById('bgNextBtn').disabled = false;
});

/* ---------- Step 2: format controls ---------- */
function updateStepperDisplay() {
  document.getElementById('photoVal').textContent = state.photoCount;
  document.getElementById('textVal').textContent = state.textCount;
}

document.getElementById('photoUp').addEventListener('click', () => {
  state.photoCount = clamp(state.photoCount + 1, PHOTO_MIN, PHOTO_MAX);
  updateStepperDisplay();
});
document.getElementById('photoDown').addEventListener('click', () => {
  state.photoCount = clamp(state.photoCount - 1, PHOTO_MIN, PHOTO_MAX);
  updateStepperDisplay();
});
document.getElementById('textUp').addEventListener('click', () => {
  state.textCount = clamp(state.textCount + 1, TEXT_MIN, TEXT_MAX);
  updateStepperDisplay();
});
document.getElementById('textDown').addEventListener('click', () => {
  state.textCount = clamp(state.textCount - 1, TEXT_MIN, TEXT_MAX);
  updateStepperDisplay();
});

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.mode = btn.dataset.mode;
    updateToggleUI();
  });
});
function updateToggleUI() {
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === state.mode);
  });
}

/* ---------- Step 3: photo uploads ---------- */
function renderUploadSlots() {
  // Resize the photos array to the chosen count, preserving existing uploads.
  state.photos.length = state.photoCount;
  for (let i = 0; i < state.photoCount; i++) {
    if (state.photos[i] === undefined) state.photos[i] = null;
  }

  const container = document.getElementById('uploadSlots');
  container.innerHTML = '';
  for (let i = 0; i < state.photoCount; i++) {
    const filled = !!state.photos[i];
    const block = document.createElement('div');
    block.className = 'upload-block';
    block.innerHTML = `
      <div class="upload-label">Photo ${i + 1} <span id="check${i}">${filled ? '✓' : ''}</span></div>
      <input type="file" accept="image/*" id="file${i}">
      <img class="preview-img" id="preview${i}" style="display:${filled ? 'block' : 'none'}" ${filled ? `src="${state.photos[i]}"` : ''}>
    `;
    container.appendChild(block);
    document.getElementById('file' + i).addEventListener('change', (e) => handleUpload(e, i));
  }

  // Configure the primary button: Next if a text step follows, else Generate.
  const btn = document.getElementById('photoNextBtn');
  if (state.textCount > 0) {
    btn.textContent = 'Next';
    btn.onclick = goNext;
  } else {
    btn.textContent = 'Generate';
    btn.onclick = generate;
  }
  updatePhotoNextEnabled();
}

function handleUpload(e, i) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.photos[i] = ev.target.result;
    document.getElementById('check' + i).textContent = '✓';
    const img = document.getElementById('preview' + i);
    img.src = ev.target.result;
    img.style.display = 'block';
    updatePhotoNextEnabled();
  };
  reader.readAsDataURL(file);
}

function updatePhotoNextEnabled() {
  let filled = 0;
  for (let i = 0; i < state.photoCount; i++) if (state.photos[i]) filled++;
  const btn = document.getElementById('photoNextBtn');
  if (btn) btn.disabled = filled < state.photoCount;
}

/* ---------- Step 4: text ---------- */
function renderTextInputs() {
  state.texts.length = state.textCount;
  const container = document.getElementById('textInputs');
  container.innerHTML = '';
  for (let i = 0; i < state.textCount; i++) {
    const ta = document.createElement('textarea');
    ta.placeholder = state.textCount === 1 ? 'Type your text...' : `Text ${i + 1}...`;
    ta.value = state.texts[i] || '';
    if (i > 0) ta.style.marginTop = '12px';
    ta.addEventListener('input', (e) => {
      state.texts[i] = e.target.value;
      updateGenerateBtn();
    });
    container.appendChild(ta);
  }
  updateGenerateBtn();
}

function updateGenerateBtn() {
  let ok = true;
  for (let i = 0; i < state.textCount; i++) {
    if (!(state.texts[i] && state.texts[i].trim())) ok = false;
  }
  const g = document.getElementById('generateBtn');
  if (g) g.disabled = !ok;
}

/* ---------- Generate / result ---------- */
function generate() {
  state.seed = Math.random() * 1e9 | 0;
  document.getElementById('rerollBtn').style.display = state.mode === 'random' ? '' : 'none';
  showScreen('screen5');
}

function reroll() {
  state.seed = Math.random() * 1e9 | 0;
  drawCanvas();
}

async function drawCanvas() {
  const canvas = document.getElementById('canvas');
  const size = 1080;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background: image (cover-fit) or white fallback
  if (state.background) {
    const bgImg = await loadImage(state.background);
    drawCover(ctx, bgImg, 0, 0, size, size);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
  }

  const imgs = await Promise.all(
    state.photos.slice(0, state.photoCount).map(src => src ? loadImage(src) : null)
  );
  const texts = state.texts.slice(0, state.textCount);

  if (state.mode === 'aligned') {
    drawAligned(ctx, size, imgs, texts);
  } else {
    drawRandom(ctx, size, imgs, texts);
  }

  // Signature watermark, painted last so it always sits on top
  await drawWatermark(ctx, size);
}

// Hand-drawn spiral signature, embedded as a data URI so the app stays a single
// self-contained file. The PNG is canvas-sized with a transparent background,

let _watermarkPromise = null;
function watermarkImage() {
  if (!_watermarkPromise) _watermarkPromise = loadImage(WATERMARK_SRC);
  return _watermarkPromise;
}
async function drawWatermark(ctx, size) {
  const img = await watermarkImage();
  ctx.drawImage(img, 0, 0, size, size);
}

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = src;
  });
}

// Draw image into a box with cover-fit (crop to fill, preserve aspect)
function drawCover(ctx, img, x, y, w, h) {
  if (!img) return;
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > boxRatio) {
    sh = img.height;
    sw = img.height * boxRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = img.width / boxRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// Word-wrap text into lines that fit a given width (respects hard line breaks)
function wrapText(ctx, text, maxWidth) {
  const paragraphs = text.split('\n');
  const allLines = [];
  for (const para of paragraphs) {
    if (!para.trim()) { allLines.push(''); continue; }
    const words = para.split(' ');
    let currentLine = '';
    for (const word of words) {
      const testLine = currentLine ? currentLine + ' ' + word : word;
      if (ctx.measureText(testLine).width > maxWidth && currentLine) {
        allLines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = testLine;
      }
    }
    if (currentLine) allLines.push(currentLine);
  }
  return allLines;
}

/* ---------- Aligned layout: neat grid of photos, text stacked below ---------- */
// 1 -> single, 2 -> side by side, 3 -> row of three, 4 -> 2x2 grid
const PHOTO_GRID = { 1: [1, 1], 2: [2, 1], 3: [3, 1], 4: [2, 2] };

function drawAligned(ctx, size, imgs, texts) {
  const sideMargin = 70;
  const topMargin = 110;
  const bottomMargin = 90;
  const gap = 36;

  const count = imgs.length;
  const [cols, rows] = PHOTO_GRID[count] || [count, 1];

  // Pre-wrap text blocks to measure the height we need to reserve below the photos
  const textFontSize = 52;
  const lineHeight = 60;
  const blockGap = 28;
  ctx.font = textFontSize + 'px VT323, monospace';
  const textMaxWidth = size - sideMargin * 2;
  const blocks = texts
    .filter(t => t && t.trim())
    .map(t => wrapText(ctx, t, textMaxWidth));

  let textHeight = 0;
  blocks.forEach((lines, i) => {
    textHeight += lines.length * lineHeight;
    if (i < blocks.length - 1) textHeight += blockGap;
  });
  const gapPhotoText = blocks.length ? 56 : 0;

  // Photo region (everything above the reserved text band)
  const photoTop = topMargin;
  let photoBottom = size - bottomMargin - textHeight - gapPhotoText;
  // Guard: always leave a reasonable photo region even if text is very tall
  photoBottom = Math.max(photoTop + 240, photoBottom);

  const regionW = size - sideMargin * 2;
  const regionH = photoBottom - photoTop;
  const cellW = (regionW - (cols - 1) * gap) / cols;
  const cellH = (regionH - (rows - 1) * gap) / rows;

  for (let i = 0; i < count; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const x = sideMargin + c * (cellW + gap);
    const y = photoTop + r * (cellH + gap);
    drawCover(ctx, imgs[i], x, y, cellW, cellH);
  }

  // Text stacked below the photos, centered
  if (blocks.length) {
    ctx.fillStyle = '#000000';
    ctx.font = textFontSize + 'px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    let y = photoBottom + gapPhotoText;
    blocks.forEach((lines, bi) => {
      lines.forEach(line => {
        ctx.fillText(line, size / 2, y);
        y += lineHeight;
      });
      if (bi < blocks.length - 1) y += blockGap;
    });
  }
}

/* ---------- Random layout: scattered placement (seeded, re-rollable) ---------- */
// Seeded RNG (mulberry32) so a given seed always re-draws the same scatter
function makeRng(seed) {
  let s = seed | 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawRandom(ctx, size, imgs, texts) {
  const rand = makeRng(state.seed || 1);
  const randRange = (a, b) => a + rand() * (b - a);
  const pad = 60;

  // Contain-fit (no crop) an image into a target square
  function containSize(img, target) {
    const r = img.width / img.height;
    return r > 1 ? { w: target, h: target / r } : { w: target * r, h: target };
  }

  // Photos at random position/size (no rotation — kept upright)
  imgs.forEach(img => {
    if (!img) return;
    const targetSize = randRange(size * 0.35, size * 0.6);
    const { w, h } = containSize(img, targetSize);
    const cx = randRange(pad + w / 2, size - pad - w / 2);
    const cy = randRange(pad + h / 2, size - pad - h / 2);
    ctx.drawImage(img, cx - w / 2, cy - h / 2, w, h);
  });

  // Text lines at random position/size
  texts.forEach(text => {
    if (!text || !text.trim()) return;
    const fontSize = Math.round(randRange(40, 80));
    ctx.font = fontSize + 'px VT323, monospace';
    ctx.fillStyle = '#000000';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const textWidth = ctx.measureText(text).width;
    const textHeight = fontSize * 1.1;
    const minX = pad + textWidth / 2;
    const maxX = size - pad - textWidth / 2;
    const minY = pad + textHeight / 2;
    const maxY = size - pad - textHeight / 2;
    const cx = maxX > minX ? randRange(minX, maxX) : size / 2;
    const cy = maxY > minY ? randRange(minY, maxY) : size / 2;

    ctx.fillText(text, cx, cy);
  });
}

/* ---------- Save ---------- */
function downloadImage() {
  const canvas = document.getElementById('canvas');
  canvas.toBlob(function (blob) {
    if (!blob) {
      alert('Image generation failed. Try regenerating.');
      return;
    }
    const url = URL.createObjectURL(blob);
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;overflow-y:auto;padding:20px;box-sizing:border-box;';
    overlay.innerHTML = `
      <div style="max-width:600px;margin:0 auto;text-align:center;">
        <p style="color:#e0e0e0;font-family:VT323,monospace;font-size:24px;margin:0 0 8px;">LONG-PRESS THE IMAGE</p>
        <p style="color:#999;font-family:VT323,monospace;font-size:18px;margin:0 0 20px;">then tap "Download image" or "Save image"</p>
        <img src="${url}" style="width:100%;max-width:500px;border:2px solid #333;display:block;margin:0 auto 20px;">
        <button id="closeOverlay" style="padding:16px 40px;font-family:VT323,monospace;font-size:22px;background:#e0e0e0;color:#0a0a0a;border:none;cursor:pointer;">Close</button>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('closeOverlay').addEventListener('click', () => {
      URL.revokeObjectURL(url);
      overlay.remove();
    });
  }, 'image/png');
}

/* ---------- Reset ---------- */
function reset() {
  state = {
    background: null,
    photoCount: 2,
    textCount: 1,
    mode: 'aligned',
    photos: [],
    texts: [],
    seed: 0
  };
  document.getElementById('bgFile').value = '';
  document.getElementById('bgCheck').textContent = '';
  document.getElementById('bgPreview').style.display = 'none';
  document.getElementById('bgNextBtn').disabled = true;
  document.getElementById('rerollBtn').style.display = 'none';
  updateStepperDisplay();
  updateToggleUI();
  showScreen('screen1');
}

// Initial paint of the format controls
updateStepperDisplay();
